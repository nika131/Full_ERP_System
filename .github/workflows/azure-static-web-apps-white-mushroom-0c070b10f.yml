name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          lfs: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: NexusERP/nexus-erp-client/package-lock.json
      - name: Build website
        working-directory: ./NexusERP/nexus-erp-client
        env:
          VITE_API_URL: "https://tenexerp-api-d0dqdzguecf8d5dq.polandcentral-01.azurewebsites.net/api"
        run: |
          npm ci
          npm run build
          cp staticwebapp.config.json dist/staticwebapp.config.json
      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_WHITE_MUSHROOM_0C070B10F }}
          repo_token: ${{ secrets.GITHUB_TOKEN }} # Used for Github integrations (i.e. PR comments)
          action: "upload"
          ###### Repository/Build Configurations - These values can be configured to match your app requirements. ######
          # For more information regarding Static Web App workflow configurations, please visit: https://aka.ms/swaworkflowconfig
          app_location: "./NexusERP/nexus-erp-client/dist" # Deploy only compiled assets
          api_location: "" # Api source code path - optional
          output_location: "" # Not used when skip_app_build is true
          skip_app_build: true
          ###### End of Repository/Build Configurations ######
        env:
          VITE_API_URL: "https://tenexerp-api-d0dqdzguecf8d5dq.polandcentral-01.azurewebsites.net/api"

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_WHITE_MUSHROOM_0C070B10F }}
          action: "close"
